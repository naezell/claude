# Static site. The build only copies files into dist/ and adds the page wrapper; see
# scripts/build-site.sh. Nothing is compiled.
[build]
  publish = "dist"
  command = "sh scripts/build-site.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Only this site's own files may run. Google is allowed for sign-in (accounts.google.com/gsi)
    # and Drive backup (www.googleapis.com). Styles allow inline because the page keeps its CSS
    # in a <style> block and reports are previewed with their own styles.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/ https://www.googleapis.com; frame-src https://accounts.google.com/gsi/; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Scripts change with each update; make browsers check for a new copy.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The sign-in page is never cached; the app itself is marked private by the edge function.
[[headers]]
  for = "/login*"
  [headers.values]
    Cache-Control = "no-store"
