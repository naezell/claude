# Runs every test (analysis engine, sign-in, test clients and the interface in headless
# Chromium) on each pull request and on every change to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install headless Chromium for the interface tests
        run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm test
      - name: Build the site
        run: sh scripts/build-site.sh
