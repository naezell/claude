<title>Ledger Lens</title>
<meta name="description" content="QuickBooks Transaction Detail audit and customer profitability dashboard for bookkeepers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --page: #f3f5f2;
    --surface: #fcfcfb;
    --surface-2: #eef1ed;
    --ink: #15201b;
    --ink-2: #4b5751;
    --muted: #7f8a84;
    --hair: #dde2dd;
    --axis: #c3c9c3;
    --accent: #17614a;
    --accent-ink: #ffffff;
    --accent-wash: #e1efe8;
    --focus: #2a78d6;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --neutral-mark: #b9c0ba;
    --pos: #2a78d6;
    --neg: #e34948;
    --good: #0ca30c;
    --good-ink: #006300;
    --warn: #fab219;
    --warn-ink: #8a5a00;
    --serious: #ec835a;
    --critical: #d03b3b;
    --critical-ink: #b02a2a;
    --critical-wash: #fbeaea;
    --warn-wash: #fdf3dc;
    --good-wash: #e3f3e3;
    --shadow: 0 1px 2px rgba(21, 32, 27, 0.06), 0 4px 16px rgba(21, 32, 27, 0.05);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0e1311;
      --surface: #161c19;
      --surface-2: #1d2521;
      --ink: #eef2ef;
      --ink-2: #b9c3bd;
      --muted: #85908a;
      --hair: #29322d;
      --axis: #3a4540;
      --accent: #4fbf94;
      --accent-ink: #0b1a13;
      --accent-wash: #173027;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --neutral-mark: #4a544f;
      --pos: #3987e5;
      --neg: #e66767;
      --good-ink: #3cc93c;
      --warn-ink: #f5c04a;
      --critical-ink: #f07a7a;
      --critical-wash: #3a1d1d;
      --warn-wash: #3a2f14;
      --good-wash: #16301a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0e1311;
    --surface: #161c19;
    --surface-2: #1d2521;
    --ink: #eef2ef;
    --ink-2: #b9c3bd;
    --muted: #85908a;
    --hair: #29322d;
    --axis: #3a4540;
    --accent: #4fbf94;
    --accent-ink: #0b1a13;
    --accent-wash: #173027;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --neutral-mark: #4a544f;
    --pos: #3987e5;
    --neg: #e66767;
    --good-ink: #3cc93c;
    --warn-ink: #f5c04a;
    --critical-ink: #f07a7a;
    --critical-wash: #3a1d1d;
    --warn-wash: #3a2f14;
    --good-wash: #16301a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .num, td.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }
  @media (min-width: 720px) { .wrap { padding-inline: 28px; } }

  /* Header */
  .topbar { border-bottom: 1px solid var(--hair); background: var(--surface); }
  .topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand h1 { font: 600 18px/1 var(--cond); letter-spacing: 0.01em; margin: 0; }
  .brand small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 6px;
    border: 1px solid var(--hair); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .source { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 12px; color: var(--ink-2); font-size: 13px; }
  .source strong { color: var(--ink); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .pill.sample { background: var(--warn-wash); color: var(--warn-ink); }
  .pill.high { background: var(--critical-wash); color: var(--critical-ink); }
  .pill.medium { background: var(--warn-wash); color: var(--warn-ink); }
  .pill.low { background: var(--surface-2); color: var(--ink-2); }
  .pill.good { background: var(--good-wash); color: var(--good-ink); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

  .error { margin-block: 12px; padding: 12px 14px; border-radius: 8px; background: var(--critical-wash); color: var(--critical-ink); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hair); margin-top: 4px; overflow-x: auto; }
  .tab {
    appearance: none; border: 0; background: none; padding: 12px 12px 11px; cursor: pointer;
    font: 600 12.5px/1 var(--cond); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  @media (min-width: 900px) { .tabs { flex-wrap: wrap; overflow-x: visible; } }
  .tab .count { font-family: var(--mono); letter-spacing: 0; margin-left: 6px; color: var(--muted); font-weight: 500; }

  main { padding-block: 22px 60px; display: grid; gap: 22px; }

  /* KPI strip */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; }
  .kpi { background: var(--surface); padding: 14px 16px 16px; display: grid; gap: 4px; align-content: start; }
  .kpi-label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
  .kpi-value { font: 500 24px/1.15 var(--mono); letter-spacing: -0.01em; }
  .kpi-sub { font-size: 12.5px; color: var(--ink-2); }
  .kpi.alert .kpi-value { color: var(--critical-ink); }
  .kpi.okay .kpi-value { color: var(--good-ink); }
  .meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
  .meter > span { display: block; height: 100%; border-radius: 3px; }

  /* Panels */
  .panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 16px 18px 12px; border-bottom: 1px solid var(--hair); }
  .panel-head h2 { font: 600 17px/1.2 var(--cond); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  .panel-head p { margin: 0; color: var(--ink-2); font-size: 13px; flex-basis: 100%; max-width: 75ch; }
  .panel-head .spacer { margin-left: auto; }
  .panel-body { padding: 14px 18px 18px; }
  .panel-body.flush { padding: 0; }
  .grid-2 { display: grid; gap: 22px; grid-template-columns: 1fr; }
  @media (min-width: 980px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

  .section-title { display: flex; align-items: baseline; gap: 12px; margin: 10px 0 -8px; }
  .section-title h2 { font: 600 13px/1 var(--cond); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--hair); }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; padding: 9px 12px; border-bottom: 1px solid var(--hair); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.row-no { color: var(--muted); font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  td .sub { display: block; color: var(--muted); font-size: 12px; }
  .scroll-y { max-height: 440px; overflow: auto; }
  .neg { color: var(--critical-ink); }
  .empty { padding: 26px 18px; color: var(--ink-2); display: flex; gap: 10px; align-items: center; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .chip .n { font-family: var(--mono); margin-left: 4px; opacity: 0.75; }

  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--hair); }
  .seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }

  .dup-group { border-bottom: 1px solid var(--hair); }
  .dup-group:last-child { border-bottom: 0; }
  .dup-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 12px 18px 4px; }
  .dup-head .exposure { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--ink-2); }
  .dup-group table td { border-bottom: 0; padding-block: 4px; }
  .dup-group table { margin-bottom: 8px; }
  .dup-table { table-layout: fixed; min-width: 640px; }

  .chart-note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .tt { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 9px 11px; box-shadow: var(--shadow); font-size: 12.5px; min-width: 170px; }
  .tt strong { display: block; margin-bottom: 4px; font-weight: 600; }
  .tt-row { display: flex; justify-content: space-between; gap: 14px; color: var(--ink-2); }
  .tt-row b { font: 500 12.5px var(--mono); color: var(--ink); }
  .tt-row i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }

  .overlaps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .overlap { border: 1px solid var(--hair); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
  .overlap h3 { margin: 0; font: 600 14px var(--cond); letter-spacing: 0.02em; }
  .overlap .tools { color: var(--ink-2); font-size: 13px; }
  .overlap .save { font-family: var(--mono); color: var(--good-ink); font-size: 13px; }

  details.mapping summary { cursor: pointer; padding: 14px 18px; font: 600 15px var(--cond); list-style-position: inside; }
  details.mapping[open] summary { border-bottom: 1px solid var(--hair); }
  details.mapping select { padding: 4px 6px; border: 1px solid var(--hair); border-radius: 5px; background: var(--surface); }

  /* Cash forecast */
  .banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--hair); background: var(--surface); }
  .banner.high { background: var(--critical-wash); border-color: transparent; }
  .banner.medium { background: var(--warn-wash); border-color: transparent; }
  .banner.good { background: var(--good-wash); border-color: transparent; }
  .banner > div { flex: 1 1 320px; max-width: 90ch; }
  .banner.high .pill, .banner.medium .pill, .banner.good .pill { background: var(--surface); }
  .inputs-row { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-start; }
  .inputs-row .field { flex: 1 1 200px; max-width: 300px; }
  .money-input { display: flex; align-items: center; border: 1px solid var(--hair); border-radius: 6px; background: var(--page); padding-left: 10px; }
  .money-input span { color: var(--muted); font-family: var(--mono); }
  .field .money-input input { border: 0; border-radius: 0; background: transparent; padding: 8px 10px 8px 4px; width: 100%; font-family: var(--mono); min-width: 0; }
  .money-input:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
  .field .money-input input:focus-visible { outline: none; }
  .hint { color: var(--muted); font-size: 12px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding-top: 24px; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  table.grid13 { font-size: 12.5px; }
  .grid13 th, .grid13 td { padding: 6px 10px; }
  .grid13 td.num, .grid13 th.num { font-family: var(--mono); }
  .grid13 tbody th { text-align: left; font-weight: 400; color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 12.5px; white-space: nowrap; position: sticky; left: 0; background: var(--surface); border-bottom: 1px solid var(--hair); z-index: 1; }
  .grid13 thead th:first-child { position: sticky; left: 0; z-index: 2; }
  .grid13 tr.group th { font: 600 11.5px var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 12px; background: var(--surface); }
  .grid13 tr.subtotal th, .grid13 tr.subtotal td { font-weight: 600; background: var(--surface-2); }
  .grid13 tr.ending th, .grid13 tr.ending td { font-weight: 600; border-top: 2px solid var(--axis); }
  .grid13 td.total { background: var(--surface-2); }
  td.warn { color: var(--warn-ink); }

  .aging { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; }
  .bucket { display: grid; gap: 4px; }
  .bucket-value { font: 500 20px var(--mono); }
  .bucket.bad .bucket-value { color: var(--critical-ink); }
  .bucket.warnb .bucket-value { color: var(--warn-ink); }
  ul.assumptions { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); max-width: 90ch; }

  /* Break-even */
  .split-bar { display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: hidden; }
  .split-bar span { display: block; height: 100%; min-width: 2px; }
  .split-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .split-legend > div { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 8px; align-items: center; }
  .split-legend i { width: 10px; height: 10px; border-radius: 2px; }
  .split-legend b { font-weight: 500; }
  .split-legend .sub { grid-column: 2 / 4; }
  .cost-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .cost-lists h3 { margin: 0 0 4px; font: 600 12px var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .cost-lists td { padding: 5px 0; }
  .cost-lists td.num { padding-left: 12px; }
  .linkish { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: inherit; }
  .whatif { display: grid; gap: 24px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .whatif { grid-template-columns: minmax(260px, 1fr) 1.4fr; } }
  .sliders { display: grid; gap: 18px; align-content: start; }
  .slider-head { display: flex; justify-content: space-between; gap: 12px; color: var(--ink); font-size: 13.5px; }
  .slider-head b { font-weight: 500; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
  .whatif-out { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .whatif-out tr.strong td { font-weight: 600; }
  .insights p { margin: 0 0 8px; max-width: 70ch; color: var(--ink-2); }
  .insights strong { color: var(--ink); }

  /* Concentration & trends */
  .share-cell { display: flex; align-items: center; gap: 8px; min-width: 150px; }
  .share-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; max-width: 120px; }
  .share-bar span { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }
  .insight-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .insight-list li { display: flex; gap: 10px; align-items: baseline; max-width: 95ch; }
  .insight-list li .pill { flex: none; }
  .trend-kpis .kpi { gap: 3px; }
  .kpi { min-width: 0; }
  .kpi .pill { white-space: normal; }
  .spark { width: 100%; height: 32px; margin: 4px 0 2px; overflow: visible; }
  .delta { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .delta.up { color: var(--good-ink); }
  .delta.down { color: var(--critical-ink); }
  .delta-label { font-weight: 400; color: var(--muted); }
  tr.partial td { color: var(--muted); }

  /* Vendors & benchmarks */
  .select, .text { padding: 8px 10px; border: 1px solid var(--hair); border-radius: 6px; background: var(--page); color: var(--ink); min-width: 0; width: 100%; }
  .bm-live { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; border-top: 1px solid var(--hair); }
  .bm-live .banner { flex-basis: 100%; }
  .bm-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .bm-card { padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
  .bm-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bm-bars { display: grid; gap: 6px; }
  .bm-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
  .bm-row b { font-weight: 500; color: var(--ink); }
  .bm-track { height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: block; }
  .bm-track > span { display: block; height: 100%; border-radius: 3px; }

  /* Review workflow */
  .review-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--ink-2); font-size: 13px; }
  .review-bar > span:first-child { flex: 1 1 320px; }
  .review-select { padding: 4px 6px; border: 1px solid var(--hair); border-radius: 5px; background: var(--surface); font-size: 12.5px; max-width: 170px; }
  .review-select.ok, .review-select.fixed { background: var(--good-wash); color: var(--good-ink); border-color: transparent; }
  .review-select.asked { background: var(--warn-wash); color: var(--warn-ink); border-color: transparent; }
  tr.cleared td, .dup-group.cleared { opacity: 0.55; }
  tr.cleared td:first-child { opacity: 1; }
  .clients-list { flex: 1; overflow: auto; display: grid; align-content: start; }
  .client-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--hair); }
  .client-row .sub { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .confirm { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }

  /* What-if scenarios */
  .scenario { display: grid; gap: 12px; }
  .lever { display: grid; grid-template-columns: minmax(150px, 200px) 1fr auto; gap: 8px 14px; align-items: end; padding: 10px 12px; border: 1px solid var(--hair); border-radius: 8px; }
  .lever > strong { align-self: center; font-weight: 600; }
  .lever-inputs { display: flex; flex-wrap: wrap; gap: 10px 14px; }
  .lever-inputs .field { flex: 1 1 150px; max-width: 240px; }
  @media (max-width: 640px) { .lever { grid-template-columns: 1fr; } }
  .add-lever { max-width: 320px; }
