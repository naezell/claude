<title>Ledger Lens</title>
<meta name="description" content="QuickBooks Transaction Detail audit and customer profitability dashboard for bookkeepers.">
<link rel="stylesheet" href="vendor/fonts.css">
<script src="src/diagnostics.js"></script>
<style>
  :root {
    --page: #f3f5f2;
    --surface: #fcfcfb;
    --surface-2: #eef1ed;
    --ink: #15201b;
    --ink-2: #4b5751;
    --muted: #7f8a84;
    --hair: #dde2dd;
    --axis: #c3c9c3;
    --accent: #2b4c1c;
    --accent-ink: #ffffff;
    --accent-wash: #e6eddf;
    --gold: #8a7126;
    --focus: #2a78d6;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --neutral-mark: #b9c0ba;
    --pos: #2a78d6;
    --neg: #e34948;
    --good: #0ca30c;
    --good-ink: #006300;
    --warn: #fab219;
    --warn-ink: #8a5a00;
    --serious: #ec835a;
    --critical: #d03b3b;
    --critical-ink: #b02a2a;
    --critical-wash: #fbeaea;
    --warn-wash: #fdf3dc;
    --good-wash: #e3f3e3;
    --shadow: 0 1px 2px rgba(21, 32, 27, 0.06), 0 4px 16px rgba(21, 32, 27, 0.05);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0e1311;
      --surface: #161c19;
      --surface-2: #1d2521;
      --ink: #eef2ef;
      --ink-2: #b9c3bd;
      --muted: #85908a;
      --hair: #29322d;
      --axis: #3a4540;
      --accent: #8cc063;
      --accent-ink: #0b1a13;
      --gold: #d2b457;
      --accent-wash: #1f2e17;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --neutral-mark: #4a544f;
      --pos: #3987e5;
      --neg: #e66767;
      --good-ink: #3cc93c;
      --warn-ink: #f5c04a;
      --critical-ink: #f07a7a;
      --critical-wash: #3a1d1d;
      --warn-wash: #3a2f14;
      --good-wash: #16301a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0e1311;
    --surface: #161c19;
    --surface-2: #1d2521;
    --ink: #eef2ef;
    --ink-2: #b9c3bd;
    --muted: #85908a;
    --hair: #29322d;
    --axis: #3a4540;
    --accent: #8cc063;
    --accent-ink: #0b1a13;
    --accent-wash: #1f2e17;
    --gold: #d2b457;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --neutral-mark: #4a544f;
    --pos: #3987e5;
    --neg: #e66767;
    --good-ink: #3cc93c;
    --warn-ink: #f5c04a;
    --critical-ink: #f07a7a;
    --critical-wash: #3a1d1d;
    --warn-wash: #3a2f14;
    --good-wash: #16301a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .num, td.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }
  @media (min-width: 720px) { .wrap { padding-inline: 28px; } }

  /* Header */
  .topbar { border-bottom: 1px solid var(--hair); background: var(--surface); }
  .topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-logo { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #fff; padding: 3px; box-shadow: inset 0 0 0 1px var(--hair); flex: none; }
  .brand h1 { font: 600 18px/1 var(--cond); letter-spacing: 0.01em; margin: 0; }
  .brand small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 6px;
    border: 1px solid var(--hair); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled, .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn:disabled:hover { background: var(--surface); filter: none; }
  .btn.primary:disabled:hover { background: var(--accent); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .source { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 12px; color: var(--ink-2); font-size: 13px; }
  .source strong { color: var(--ink); font-weight: 600; }
  .sub-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; font: 600 15px/1.2 var(--cond); }
  tr.total td { font-weight: 600; background: var(--surface-2); }
  .part { display: contents; }
  .growth-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 20px; margin-bottom: 14px; }
  .growth-strip > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .growth-strip .kpi-value { font-size: 22px; }
  .assumptions { margin-bottom: 14px; font-size: 13px; color: var(--ink-2); }
  .assumptions summary { cursor: pointer; }
  .assumptions .drawer-fields { margin-top: 10px; }
  .insight-list.playbook p { margin: 2px 0 0; }
  td.names-cell { min-width: 260px; }
  .compact-list { margin: 0 0 8px; padding-left: 18px; font-size: 14px; line-height: 1.5; }
  .tips ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
  .tips li + li { margin-top: 6px; }
  .asset-form { margin-top: 14px; padding: 14px; border: 1px solid var(--hair); border-radius: 8px; background: var(--page); }
  .row-actions { white-space: nowrap; }
  .row-actions .btn + .btn { margin-left: 6px; }
  body.flagging main, body.flagging .home { cursor: crosshair; }
  .flag-hover { outline: 3px solid var(--accent) !important; outline-offset: 2px; border-radius: 8px; }
  .flag-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 60; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; width: min(720px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--hair); box-shadow: 0 8px 28px rgba(0,0,0,.18); font-size: 14px; }
  .flag-bar > span:first-child { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .flag-bar svg { width: 16px; height: 16px; flex: none; }
  .flag-actions { display: flex; gap: 8px; margin-left: auto; }
  .ticket-shot { margin: 0 0 12px; }
  .ticket-shot img { display: block; max-width: 100%; max-height: 320px; object-fit: contain; object-position: left top; border: 1px solid var(--hair); border-radius: 6px; }
  .industry-pick { display: inline-flex; align-items: center; gap: 6px; }
  .industry-pick .select { width: auto; padding: 4px 8px; font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .pill.sample { background: var(--warn-wash); color: var(--warn-ink); }
  .pill.high { background: var(--critical-wash); color: var(--critical-ink); }
  .pill.medium { background: var(--warn-wash); color: var(--warn-ink); }
  .pill.low { background: var(--surface-2); color: var(--ink-2); }
  .pill.good { background: var(--good-wash); color: var(--good-ink); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

  .working { display: flex; align-items: center; gap: 10px; margin-block: 12px; padding: 10px 14px; border-radius: 8px; background: var(--accent-wash); color: var(--ink); font-size: 14px; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--hair); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  main.stale { opacity: 0.6; transition: opacity 0.2s; }
  .error { margin-block: 12px; padding: 12px 14px; border-radius: 8px; background: var(--critical-wash); color: var(--critical-ink); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hair); margin-top: 4px; overflow-x: auto; }
  .tabs-row { display: flex; align-items: flex-end; gap: 8px; }
  .tabs-row .tabs { flex: 1 1 auto; min-width: 0; }
  .customize-toggle { flex: none; margin-bottom: 6px; }
  @media (max-width: 599px) {
    .tabs-row { flex-wrap: wrap; }
    .tabs-row .tabs { flex-basis: 100%; order: -1; }
    .flag-toggle { order: 0; }
    .customize-toggle { order: 0; }
  }
  .customize-bar { border-color: var(--accent); }
  .customize-actions { display: flex; gap: 8px; margin-left: auto; }
  .customize-sub { font: 600 13px/1.2 var(--cond); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 8px; }
  .tab-arrange { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .tab-arrange li { display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; border: 1px solid var(--hair); border-radius: 8px; background: var(--page); font-size: 13px; }
  .tab-arrange li span { margin-right: 4px; }
  .tab-arrange li.off span { color: var(--muted); text-decoration: line-through; }
  .tab-arrange .btn, .arrange-actions .btn { padding: 4px 8px; font-size: 12.5px; min-height: 0; }
  /* min-width: 0 keeps a wide table inside from stretching the page grid. */
  .arrange-item { border: 1px dashed var(--axis); border-radius: 12px; padding: 8px; min-width: 0; }
  .arrange-body { display: grid; gap: 22px; min-width: 0; }
  .arrange-item.off { opacity: 0.7; }
  .arrange-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; padding: 2px 4px 8px; }
  .arrange-item.off .arrange-bar { padding-bottom: 2px; }
  .arrange-label { font: 600 14px/1.2 var(--cond); }
  .arrange-actions { display: flex; gap: 4px; }

  .tab {
    appearance: none; border: 0; background: none; padding: 12px 12px 11px; cursor: pointer;
    font: 600 12.5px/1 var(--cond); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  @media (min-width: 900px) { .tabs { flex-wrap: wrap; overflow-x: visible; } }
  .tab .count { font-family: var(--mono); letter-spacing: 0; margin-left: 6px; color: var(--muted); font-weight: 500; }

  main { padding-block: 22px 60px; display: grid; gap: 22px; }

  /* KPI strip */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; }
  .kpi { background: var(--surface); padding: 14px 16px 16px; display: grid; gap: 4px; align-content: start; }
  .kpi-label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
  .kpi-value { font: 500 24px/1.15 var(--mono); letter-spacing: -0.01em; }
  .kpi-sub { font-size: 12.5px; color: var(--ink-2); }
  .kpi.alert .kpi-value { color: var(--critical-ink); }
  .kpi.okay .kpi-value { color: var(--good-ink); }
  .meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
  .meter > span { display: block; height: 100%; border-radius: 3px; }

  /* Panels */
  .panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 16px 18px 12px; border-bottom: 1px solid var(--hair); }
  .panel-head h2 { font: 600 17px/1.2 var(--cond); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  .panel-head p { margin: 0; color: var(--ink-2); font-size: 13px; flex-basis: 100%; max-width: 75ch; }
  .panel-head .spacer { margin-left: auto; }
  .panel-body { padding: 14px 18px 18px; }
  .panel-body.flush { padding: 0; }
  .grid-2 { display: grid; gap: 22px; grid-template-columns: 1fr; }
  @media (min-width: 980px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

  .section-title { display: flex; align-items: baseline; gap: 12px; margin: 10px 0 -8px; }
  .section-title h2 { font: 600 13px/1 var(--cond); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--hair); }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; padding: 9px 12px; border-bottom: 1px solid var(--hair); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.row-no { color: var(--muted); font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  td .sub { display: block; color: var(--muted); font-size: 12px; }
  .scroll-y { max-height: 440px; overflow: auto; }
  .neg { color: var(--critical-ink); }
  .empty { padding: 26px 18px; color: var(--ink-2); display: flex; gap: 10px; align-items: center; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .chip .n { font-family: var(--mono); margin-left: 4px; opacity: 0.75; }

  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--hair); }
  .seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }

  .dup-group { border-bottom: 1px solid var(--hair); }
  .dup-group:last-child { border-bottom: 0; }
  .dup-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 12px 18px 4px; }
  .dup-head .exposure { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--ink-2); }
  .dup-group table td { border-bottom: 0; padding-block: 4px; }
  .dup-group table { margin-bottom: 8px; }
  .dup-table { table-layout: fixed; min-width: 640px; }

  .chart-note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .tt { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 9px 11px; box-shadow: var(--shadow); font-size: 12.5px; min-width: 170px; }
  .tt strong { display: block; margin-bottom: 4px; font-weight: 600; }
  .tt-row { display: flex; justify-content: space-between; gap: 14px; color: var(--ink-2); }
  .tt-row b { font: 500 12.5px var(--mono); color: var(--ink); }
  .tt-row i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }

  .overlaps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .overlap { border: 1px solid var(--hair); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
  .overlap h3 { margin: 0; font: 600 14px var(--cond); letter-spacing: 0.02em; }
  .overlap .tools { color: var(--ink-2); font-size: 13px; }
  .overlap .save { font-family: var(--mono); color: var(--good-ink); font-size: 13px; }

  details.mapping summary { cursor: pointer; padding: 14px 18px; font: 600 15px var(--cond); list-style-position: inside; }
  details.mapping[open] summary { border-bottom: 1px solid var(--hair); }
  details.mapping select { padding: 4px 6px; border: 1px solid var(--hair); border-radius: 5px; background: var(--surface); }

  /* Cash forecast */
  .banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--hair); background: var(--surface); }
  .banner.high { background: var(--critical-wash); border-color: transparent; }
  .banner.medium { background: var(--warn-wash); border-color: transparent; }
  .banner.good { background: var(--good-wash); border-color: transparent; }
  .banner > div { flex: 1 1 320px; max-width: 90ch; }
  .storage-note { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .storage-note.neg { color: var(--critical-ink); }
  .home { padding-block: 22px 60px; display: grid; gap: 22px; }
  .home-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .home-head h2 { margin: 0; font: 600 22px/1.2 var(--cond); }
  .home-empty h2 { margin: 0 0 8px; font: 600 20px/1.2 var(--cond); }
  .home-empty p { max-width: 70ch; color: var(--ink-2); }
  .task-list { list-style: none; margin: 0; padding: 0; }
  .task-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--hair); }
  .task-list li:last-child { border-bottom: 0; }
  .task-list .sub { white-space: pre-line; }
  .task-list li > div { display: grid; gap: 2px; min-width: 0; }
  .task-client { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .task-text { font-weight: 600; }
  .task-list .btn { flex: none; }
  .client-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .client-card { border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; justify-items: start; background: var(--page); }
  .client-card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; width: 100%; justify-content: space-between; }
  .lender-issues { margin: 0 20px 12px; padding: 12px 14px; border: 1px solid var(--hair); border-radius: 10px; background: var(--surface-2); max-height: 220px; overflow: auto; }
  .lender-issues h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font: 600 15px/1.2 var(--cond); }
  .lender-issues ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
  .lender-issues .sub { display: block; }
  .package-summary { margin-top: 12px; display: grid; gap: 8px; justify-items: start; }
  .package-summary p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
  .portal-block { margin: 0 20px 14px; padding: 14px 16px; border: 1px solid var(--hair); border-radius: 10px; background: var(--surface-2); }
  .portal-block h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font: 600 15px/1.2 var(--cond); }
  .portal-block h3 svg { width: 16px; height: 16px; }
  .portal-block p { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-2); max-width: 75ch; }
  .portal-fields { padding: 0; margin-bottom: 10px; }
  .portal-fields textarea { padding: 8px 10px; border: 1px solid var(--hair); border-radius: 6px; background: var(--page); color: var(--ink); }
  .portal-link { width: 100%; font: 12.5px var(--mono); padding: 8px 10px; border: 1px solid var(--hair); border-radius: 6px; background: var(--page); color: var(--ink); margin-bottom: 10px; }
